[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "health-assistant-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.139,<1", "uvicorn[standard]>=0.51,<1", "pydantic-settings>=2.15,<3", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.16,<2", "httpx>=0.28,<1", "argon2-cffi>=25.1,<26", "email-validator>=2.3,<3", "cryptography>=50,<51", "python-multipart>=0.0.32,<1", "Pillow>=12.3,<13", "pypdfium2>=5.13,<6", "health-research-core==0.1.0"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
