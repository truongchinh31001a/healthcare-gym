[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "health-assistant-ai-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.139,<1", "uvicorn[standard]>=0.51,<1", "pydantic-settings>=2.15,<3", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
