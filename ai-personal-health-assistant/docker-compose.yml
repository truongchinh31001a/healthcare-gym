services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-health_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-health}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-service:
    build: ./services/ai-service
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-health}:${POSTGRES_PASSWORD:-local-development-only}@database:5432/${POSTGRES_DB:-health_assistant}
      ENVIRONMENT: development
      STORAGE_DIR: /private-storage
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      AI_SERVICE_URL: http://ai-service:8000
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - private-storage:/private-storage
    depends_on:
      database:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5

  retention:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-health}:${POSTGRES_PASSWORD:-local-development-only}@database:5432/${POSTGRES_DB:-health_assistant}
      STORAGE_DIR: /private-storage
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
    volumes:
      - private-storage:/private-storage
    depends_on:
      api:
        condition: service_healthy
    command: ["sh", "-c", "while true; do python -m app.maintenance --apply; sleep 3600; done"]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  private-storage:
